<div class="modal-container">
  <div class="modal-header">
    <h2>Add Stop</h2>
  </div>

  <hr class="divider" />

  <div class="tab-group">
    <button type="button" class="tab-btn" [class.active]="activeTab === 'standard'" (click)="setActiveTab('standard')">
      Standard Stop
    </button>

    <button type="button" class="tab-btn" [class.active]="activeTab === 'other'" (click)="setActiveTab('other')">
      Other Stop
    </button>

    <button type="button" class="tab-btn" [class.active]="activeTab === 'additional'"
      (click)="setActiveTab('additional')">
      Additional Information
    </button>
  </div>

  <div class="meta-info-grid">
    <div class="meta-item">
      <span class="meta-label">SERVICE NAME</span>
      <span class="meta-value highlights">{{ serviceInfo.name }}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">START TIME</span>
      <span class="meta-value highlights">{{ formatTime(serviceInfo.startTime) }}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">END TIME</span>
      <span class="meta-value highlights">{{ formatTime(serviceInfo.endTime) }}</span>
    </div>
  </div>

  <form [formGroup]="stopForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div *ngIf="activeTab !== 'additional'" class="form-group flex-1">
        <label for="stopLocation">Stop</label>
        <select id="stopLocation" formControlName="stopLocation" class="form-control">
          <option value="">Select Stop Location</option>
          <!-- <option *ngFor="let stop of stopLocations" [value]="stop.id">
            {{ stop.supplierName }}
          </option> -->
          <option *ngIf="activeTab === 'other'">
            Add Order Stop
          </option>
        </select>
      </div>

      <div class="form-group flex-1" style="position: relative;">
        <label for="scheduleTime">Schedule Time</label>
        <div class="select-wrapper" (click)="showTimePicker = !showTimePicker">
          <input id="scheduleTime" type="text" readonly [value]="stopForm.get('scheduleTime')?.value"
            placeholder="Select Time" class="form-control select-control" />
        </div>
        <app-time-picker *ngIf="showTimePicker" style="position: absolute; top: 100%; right: 0; z-index: 10; margin-top: 4px;"
          [initialTime]="stopForm.get('scheduleTime')?.value" (timeSelected)="updateTime($event)"
          (closePicker)="showTimePicker = false">
        </app-time-picker>
      </div>
    </div>

    <div class="form-group full-width">
      <label for="note">Note</label>
      <input id="note" type="text" formControlName="note" placeholder="Enter Note" class="form-control" />
    </div>

    <hr class="divider footer-divider" />

    <div class="form-actions">
      <button type="submit" class="btn btn-submit" [disabled]="stopForm.invalid">
        ADD STOP
      </button>
      <button type="button" class="btn btn-cancel" (click)="onCancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
