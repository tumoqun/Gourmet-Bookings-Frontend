<aside class="sidebar" aria-label="Main navigation" [class.collapsed]="isSidebarCollapsed">
  <div class="logo-wrap">
    <img src="/tma-tour-management-logo.png" alt="TMA Tour Management logo" />
  </div>
  <button class="collapse-dot" type="button"
    [attr.aria-label]="isSidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.aria-expanded]="!isSidebarCollapsed" (click)="toggleSidebar()">
    <span *ngIf="isSidebarCollapsed" aria-hidden="true">&rsaquo;</span>
    <span *ngIf="!isSidebarCollapsed" aria-hidden="true">&lsaquo;</span>
  </button>

<!--  @if (showViewSwitcher()) {-->
<!--    <div class="view-switcher">-->
<!--      @if (inGuideViewMode()) {-->
<!--        <button type="button" (click)="switchToAdminView()">Admin view</button>-->
<!--      } @else {-->
<!--        <button type="button" (click)="switchToGuideView()">Tour Guide view</button>-->
<!--      }-->
<!--    </div>-->
<!--  }-->

  <nav class="nav-list">
    <a
      class="nav-item"
      *ngFor="let item of navItems()"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.path !== '/works' }"
    >
      <img class="nav-icon" [src]="item.icon" [alt]="item.label + ' icon'" />
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="profile">
      <span class="avatar">{{ initials() }}</span>
      <span>
        <strong>{{ currentUser()?.fullName || 'User' }}</strong>
        <small>{{ currentUser()?.role || 'Role' }}</small>
      </span>
    </div>
    <a href="/">
      <img class="sidebar-link-icon" src="/ui-icons/support.png" alt="Support icon" />
      <span>Support</span>
    </a>
    <button type="button" class="logout-button" (click)="logout()">
      <img class="sidebar-link-icon" src="/ui-icons/logout.png" alt="Logout icon" />
      <span>Logout</span>
    </button>
  </div>
</aside>
