<main class="login-shell" aria-labelledby="confirm-password-title">
  <section class="login-canvas">
    <div class="brand">
      <img class="brand-logo" src="/tma-tour-management-logo.png" alt="TMA Tour Management logo" />
      <h1 id="confirm-password-title">TMA Tour Management</h1>
      <p>Confirm Your Password and Activate Your Account.</p>
    </div>

    <form class="login-card" aria-label="Confirm Password" (ngSubmit)="onSubmit()">
      <h2>Confirm Password</h2>

      <div *ngIf="error()" class="login-error" role="alert">
        {{ error() }}
      </div>

      <div *ngIf="success()" class="login-success" role="alert">
        {{ success() }}
      </div>

      <label class="field" *ngIf="!success()">
        <span>New Password</span>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="********"
          required
          minlength="8"
        />
      </label>

      <label class="field" *ngIf="!success()">
        <span>Confirm New Password</span>
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="********"
          required
          minlength="8"
        />
      </label>

      <button class="primary-action" type="submit" [disabled]="loading() || !token" *ngIf="!success()">
        {{ loading() ? 'Saving…' : 'Save & Confirm' }}
      </button>

      <div class="back-to-login" *ngIf="success()">
        <a routerLink="/login">Go to login page now</a>
      </div>
    </form>

    <footer class="login-footer">
      <a href="/">Privacy Policy</a>
      <span aria-hidden="true">&middot;</span>
      <a href="/">Terms of Service</a>
      <span aria-hidden="true">&middot;</span>
      <a href="/">Contact Support</a>
    </footer>
  </section>
</main>
